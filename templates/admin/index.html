<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Story Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: dark light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #090d16;
      --surface: rgba(16, 22, 35, 0.85);
      --surface-2: rgba(21, 28, 44, 0.9);
      --text: #f6f8fa;
      --muted: rgba(246, 248, 250, 0.65);
      --accent: #3d8bfd;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(120% 120% at 10% 10%, #0d1322 0%, #05070c 45%, #03040a 100%);
      color: var(--text);
    }
    header {
      padding: 24px 40px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2vw, 2rem);
    }
    .controls {
      padding: 12px 40px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
    }
    label {
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    input[type="text"],
    select {
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      border: 1px solid rgba(61, 139, 253, 0.35);
      background: rgba(17, 23, 39, 0.75);
      color: inherit;
      min-width: 180px;
    }
    button,
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0.55rem 0.9rem;
      font-size: 0.95rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(61, 139, 253, 0.95), rgba(111, 66, 193, 0.95));
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:disabled,
    .chip:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:hover,
    .chip:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(61, 139, 253, 0.35);
    }
    .chip {
      background: rgba(17, 25, 39, 0.85);
      color: var(--text);
      border: 1px solid rgba(61, 139, 253, 0.3);
    }
    .chip[data-active="true"] {
      background: linear-gradient(135deg, rgba(61, 139, 253, 0.95), rgba(111, 66, 193, 0.95));
      color: #fff;
      box-shadow: 0 10px 30px rgba(61, 139, 253, 0.4);
    }
    .tonal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      border: 1px solid rgba(61, 139, 253, 0.3);
      background: rgba(17, 25, 39, 0.85);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .tonal:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(61, 139, 253, 0.3);
    }
    .danger {
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.95), #ff4d79);
    }
    .flash {
      margin: 12px 40px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(61, 139, 253, 0.15);
      color: var(--text);
      display: none;
    }
    .workspace {
      padding: 12px 40px 60px;
      display: grid;
      grid-template-columns: minmax(0, 2.6fr) minmax(320px, 1fr);
      gap: 24px;
    }
    @media (max-width: 1200px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }
    .panel {
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 24px 70px rgba(5, 9, 17, 0.6);
      overflow: hidden;
      position: relative;
    }
    .panel.hidden {
      display: none;
    }
    .canvas-container {
      position: relative;
      height: 72vh;
      min-height: 520px;
      overflow: hidden;
      background: radial-gradient(circle at top, rgba(61, 139, 253, 0.08), transparent 55%),
                  linear-gradient(170deg, rgba(7, 11, 21, 0.85), rgba(4, 6, 12, 0.92));
    }
    .canvas-toolbar {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 8px;
      z-index: 2;
    }
    .canvas-toolbar button {
      background: rgba(12, 18, 30, 0.75);
      border: 1px solid rgba(61, 139, 253, 0.35);
      padding: 0.45rem 0.6rem;
      font-size: 0.85rem;
    }
    svg {
      width: 100%;
      height: 100%;
      user-select: none;
      cursor: grab;
    }
    svg:active {
      cursor: grabbing;
    }
    .tree-edge {
      fill: none;
      stroke: rgba(103, 125, 170, 0.55);
      stroke-width: 2.2;
    }
    .tree-node {
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .tree-node[data-collapsed="true"] {
      opacity: 0.72;
    }
    .tree-node rect.backdrop {
      fill: rgba(12, 18, 30, 0.78);
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1.2;
    }
    .tree-node:hover rect.backdrop {
      stroke: rgba(61, 139, 253, 0.5);
    }
    .tree-node[data-selected="true"] rect.backdrop {
      stroke: var(--accent);
      stroke-width: 2.2;
      filter: drop-shadow(0 10px 18px rgba(61, 139, 253, 0.4));
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.8rem;
      text-transform: capitalize;
      background: rgba(61, 139, 253, 0.12);
    }
    .status-pill[data-status="ready"] { background: rgba(66, 207, 151, 0.23); }
    .status-pill[data-status="failed"] { background: rgba(255, 107, 107, 0.22); }
    .status-pill[data-status="queued"] { background: rgba(246, 173, 85, 0.25); }
    .status-pill[data-status="pending"] { background: rgba(96, 125, 139, 0.28); }
    .list-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    .list-table thead {
      background: rgba(255, 255, 255, 0.05);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.75rem;
    }
    .list-table th,
    .list-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .list-table tbody tr:hover {
      background: rgba(61, 139, 253, 0.08);
    }
    .inspector {
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--surface-2);
    }
    .inspector h2 {
      margin: 0;
      font-size: 1.15rem;
    }
    .inspector video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      max-height: 220px;
    }
    .inspector .meta {
      display: grid;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .children-list {
      display: grid;
      gap: 8px;
      font-size: 0.88rem;
    }
    .child-row {
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .view-toggle {
      display: inline-flex;
      border-radius: 999px;
      border: 1px solid rgba(61, 139, 253, 0.25);
      overflow: hidden;
    }
    .view-toggle button {
      border-radius: 0;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0.45rem 0.9rem;
      font-size: 0.9rem;
    }
    .view-toggle button[data-active="true"] {
      color: #fff;
      background: rgba(61, 139, 253, 0.25);
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.78);
      backdrop-filter: blur(14px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      z-index: 30;
    }
    .overlay.active { display: flex; }
    .modal {
      width: min(960px, 92vw);
      background: rgba(8, 12, 20, 0.96);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal video {
      width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      background: #000;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 1rem;
    }
    .modal-header button {
      padding: 0.35rem 0.7rem;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Shared World Admin</h1>
      <p class="muted">Manage generated branches, preview clips, and recycle paths.</p>
    </div>
    <form method="post" action="/admin/logout">
      <button type="submit" class="tonal">Log out</button>
    </form>
  </header>

  <div class="controls">
    <label>
      Path prefix
      <input id="prefix-input" type="text" placeholder="e.g. 0/1" />
    </label>
    <label>
      Status
      <select id="status-filter">
        <option value="">Any</option>
        <option value="ready">Ready</option>
        <option value="queued">Queued</option>
        <option value="pending">Pending</option>
        <option value="failed">Failed</option>
      </select>
    </label>
    <label>
      Focus path
      <div style="display:flex; gap:8px;">
        <input id="focus-input" type="text" placeholder="path (e.g. 1/2)" style="min-width:160px;" />
        <button type="button" id="focus-btn" class="chip">Center</button>
      </div>
    </label>
    <div class="view-toggle">
      <button type="button" id="view-canvas" data-active="true">Canvas</button>
      <button type="button" id="view-list">List</button>
    </div>
    <button type="button" id="reload-btn" class="chip">Reload</button>
    <button type="button" id="reset-root" class="danger">Reset entire world</button>
  </div>

  <div id="flash" class="flash"></div>

  <div class="workspace">
    <section id="canvas-panel" class="panel">
      <div class="canvas-container">
        <div class="canvas-toolbar">
          <button type="button" id="zoom-in">+</button>
          <button type="button" id="zoom-out">−</button>
          <button type="button" id="zoom-reset">Reset</button>
        </div>
        <svg id="story-canvas">
          <g id="canvas-group">
            <g id="edge-layer"></g>
            <g id="node-layer"></g>
          </g>
        </svg>
      </div>
    </section>

    <section id="list-panel" class="panel hidden">
      <table class="list-table">
        <thead>
          <tr>
            <th style="width:22%">Path</th>
            <th style="width:14%">Status</th>
            <th style="width:20%">Updated</th>
            <th>Scenario</th>
            <th style="width:12%">Actions</th>
          </tr>
        </thead>
        <tbody id="list-table-body"></tbody>
      </table>
    </section>

    <aside class="panel inspector" id="inspector">
      <div>
        <h2 id="inspector-title">Select a node</h2>
        <div id="inspector-status" class="status-pill" data-status="pending" style="display:none;">pending</div>
      </div>
      <video id="inspector-video" controls preload="none" muted playsinline></video>
      <div class="meta">
        <span id="inspector-scenario">Hover or select a branch to preview prompts and media.</span>
        <span id="inspector-updated"></span>
        <span id="inspector-storage"></span>
      </div>
      <div>
        <h3 style="margin:0 0 6px; font-size:1rem;">Children</h3>
        <div id="inspector-children" class="children-list"></div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:10px;">
        <button type="button" id="play-video" class="chip">Play clip</button>
        <button type="button" id="open-modal" class="chip">Open modal</button>
        <button type="button" id="scrub-branch" class="chip">Scrub branch</button>
        <button type="button" id="stop-scrub" class="chip">Stop scrub</button>
        <button type="button" id="reset-branch" class="danger">Reset branch</button>
      </div>
    </aside>
  </div>

  <div id="preview-overlay" class="overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 id="preview-title">Preview</h3>
        <button type="button" id="close-preview">Close</button>
      </div>
      <video id="preview-video" controls preload="none" poster="" playsinline></video>
      <div class="muted" id="preview-links"></div>
    </div>
  </div>

  <script type="module" src="/static/admin/canvas.js"></script>
</body>
</html>
